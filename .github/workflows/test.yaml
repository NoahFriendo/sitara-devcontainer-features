name: CI - Test Features

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-options:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate rejected options and architectures
        run: bash test/validate-options.sh
      - name: Run ShellCheck
        # These files are supplied by the target image and Feature test harness.
        run: shellcheck --exclude=SC1091 src/*/install.sh scripts/*.sh test/*.sh test/*/*.sh

  test-features:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        feature:
          - mcu-plus-sdk-am263x
          - ti-arm-clang
          - sysconfig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install devcontainer CLI 0.88.0
        run: npm install -g @devcontainers/cli@0.88.0
      - name: Test ${{ matrix.feature }} across supported Debian and Ubuntu bases
        run: devcontainer features test -f ${{ matrix.feature }} --skip-autogenerated .

  test-composed-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install devcontainer CLI 0.88.0
        run: npm install -g @devcontainers/cli@0.88.0
      - name: Build and test the composed AM263x toolchain
        run: devcontainer features test --global-scenarios-only .
